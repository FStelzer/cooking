version: '3'

tasks:
  default:
    desc: Liste verfügbare Tasks
    cmds:
      - task --list

  sidebar:
    desc: Generiere _sidebar.md aus den Markdown-Dateien in Unterordnern (🚧-Titel → Sektion "in arbeit")
    cmds:
      - python3 -m tools.recipes.site sidebar

  index:
    desc: Generiere kochmodus/rezepte.json (Rezeptliste der Kochmodus-App, alle Rezepte mit JSON)
    cmds:
      - python3 -m tools.recipes.site index

  learnings:
    desc: Generiere den "Bisherige Projekte"-Block in CLAUDE.md aus den ## Learnings-Sektionen der Rezepte
    cmds:
      - python3 -m tools.recipes.site learnings

  hooks:
    desc: Pre-Commit-Hook aktivieren (.githooks/pre-commit → task validate vor jedem Commit)
    cmds:
      - git config core.hooksPath .githooks
      - echo "core.hooksPath = .githooks — 'task validate' läuft jetzt vor jedem Commit (git commit --no-verify überspringt)"

  serve:
    desc: Lokalen Python-Webserver auf Port 3000 starten (Kochmodus unter /kochmodus/)
    cmds:
      - python3 -m http.server 3000

  build:
    desc: Rezeptformat — Markdown nach REZEPTFORMAT.md → JSON daneben (alle Rezepte mit JSON, oder CLI_ARGS)
    cmds:
      - python3 -m tools.recipes.cli build {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}$(ls {gerichte,menues,desserts,backen,eis,schwangerschaft,technik}/*.json 2>/dev/null | sed 's/\.json$/.md/'){{end}}
      - python3 -m tools.recipes.site index
      - python3 -m tools.recipes.site sw

  validate:
    desc: Rezeptformat — Parser-Tests, Checks A–L gegen alle gebauten JSONs, JSON/Sidebar/Learnings aktuell? (Pre-Commit-Gate, s. task hooks)
    cmds:
      - python3 tools/test_parse.py
      - python3 -m tools.recipes.cli check $(ls {gerichte,menues,desserts,backen,eis,schwangerschaft,technik}/*.json 2>/dev/null)
      - python3 -m tools.recipes.cli build --check $(ls {gerichte,menues,desserts,backen,eis,schwangerschaft,technik}/*.json 2>/dev/null | sed 's/\.json$/.md/')
      - python3 -m tools.recipes.site sidebar --check
      - python3 -m tools.recipes.site learnings --check
      - python3 -m tools.recipes.site index --check
      - python3 -m tools.recipes.site sw --check

  test-kochmodus:
    desc: Kochmodus — Node-Tests der reinen Funktionen (lib.js)
    cmds:
      - node tools/test_kochmodus.mjs

  smoke-kochmodus:
    desc: Kochmodus — Playwright-Rauchtest im Container (podman, Image wie auf dem Dev-Server)
    vars:
      PW_VERSION: '{{.PW_VERSION | default "1.59.1"}}'
      PW_IMAGE: '{{.PW_IMAGE | default "container.ams1.ops.xxx/mirrored/playwright:v1.59.1"}}'
    cmds:
      - >-
        podman run --rm --network=host -v .:/work:rw,Z -w /work {{.PW_IMAGE}}
        env PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npx -y -p playwright@{{.PW_VERSION}} sh -c
        'export PLAYWRIGHT_DIR="$(dirname "$(dirname "$(command -v playwright)")")/";
        node tools/smoke_kochmodus.mjs {{.CLI_ARGS}} && node tools/smoke_docsify_link.mjs'
