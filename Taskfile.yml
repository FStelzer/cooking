version: '3'

tasks:
  default:
    desc: Liste verfügbare Tasks
    cmds:
      - task --list

  sidebar:
    desc: Generiere _sidebar.md aus den Markdown-Dateien in Unterordnern (🚧-Titel → Sektion "in arbeit")
    cmds:
      - |
        {
          get_title() {
            t=$(awk '/^# /{sub(/^# +/, ""); print; exit}' "$1")
            [ -z "$t" ] && t=$(basename "$1" .md)
            printf '%s' "$t"
          }
          # Ideen-Backlog zuoberst (Einstiegspunkt)
          echo "- [Ideen-Backlog](/ideen.md)"
          # Rezepte in Arbeit: H1-Titel beginnt mit 🚧
          wip=""
          for dir in */; do
            dir="${dir%/}"
            case "$dir" in
              .*) continue ;;
            esac
            for f in "$dir"/*.md; do
              [ -e "$f" ] || continue
              case "$(get_title "$f")" in
                "🚧"*) wip="$wip $f" ;;
              esac
            done
          done
          if [ -n "$wip" ]; then
            echo "- **🚧 in arbeit**"
            for f in $wip; do
              title=$(get_title "$f")
              title="${title#"🚧"}"; title="${title# }"
              echo "  - [${title}](/${f})"
            done
          fi
          # Kategorien (ohne 🚧-Rezepte)
          for dir in */; do
            dir="${dir%/}"
            case "$dir" in
              .*) continue ;;
            esac
            files=""
            for f in "$dir"/*.md; do
              [ -e "$f" ] || continue
              case "$(get_title "$f")" in
                "🚧"*) continue ;;
              esac
              files="$files $f"
            done
            [ -z "$files" ] && continue
            echo "- **${dir}**"
            for f in $files; do
              # ✅-Präfix für gekochte Rezepte (= ## Learnings-Sektion vorhanden)
              if grep -q '^## Learnings' "$f"; then
                echo "  - [✅ $(get_title "$f")](/${f})"
              else
                echo "  - [$(get_title "$f")](/${f})"
              fi
            done
          done
        } > _sidebar.md

  learnings:
    desc: Generiere den "Bisherige Projekte"-Block in CLAUDE.md aus den ## Learnings-Sektionen der Rezepte
    cmds:
      - |
        tmp=$(mktemp) gen=$(mktemp)
        for f in */*.md; do
          case "$f" in
            _*) continue ;;
          esac
          awk -v path="$f" '
            /^# / { if (!title) { title = $0; sub(/^# +/, "", title); sub(/^🚧 */, "", title) } }
            /^## Learnings/ { inlearn = 1; next }
            inlearn && /^##/ { exit }
            inlearn { body = body $0 "\n" }
            END {
              sub(/^\n+/, "", body); sub(/\n+$/, "", body)
              if (body == "") exit
              # Sortierschlüssel: erstes MM/JJJJ in der Kurzfassung, sonst 0000-00 (undatiert zuerst)
              key = "0000-00"
              if (match(body, /[0-9][0-9]\/[0-9][0-9][0-9][0-9]/)) {
                d = substr(body, RSTART, RLENGTH)
                key = substr(d, 4, 4) "-" substr(d, 1, 2)
              }
              n = split(body, lines, "\n")
              out = "- ✅ **" title "** (siehe `" path "`)"
              for (i = 1; i <= n; i++) out = out "\n" (lines[i] == "" ? "" : "  " lines[i])
              gsub(/\n/, "\x01", out)
              print key "\t" out
            }
          ' "$f"
        done | sort > "$tmp"
        while IFS="$(printf '\t')" read -r _key entry; do
          printf '%s\n\n' "$entry" | tr '\001' '\n'
        done < "$tmp" > "$gen"
        awk -v gen="$gen" '
          /<!-- learnings:start -->/ { print; print ""; while ((getline line < gen) > 0) print line; skip = 1; next }
          /<!-- learnings:end -->/ { skip = 0 }
          !skip
        ' CLAUDE.md > CLAUDE.md.new && mv CLAUDE.md.new CLAUDE.md
        rm -f "$tmp" "$gen"

  serve:
    desc: Lokalen Python-Webserver auf Port 3000 starten (Kochmodus unter /kochmodus/)
    cmds:
      - python3 -m http.server 3000

  validate:
    desc: Rezeptformat — Checks A–D, K gegen alle Beispiel-JSONs (tools/recipes)
    cmds:
      - python3 -m tools.recipes.cli check schema/beispiele/*.json

  test-kochmodus:
    desc: Kochmodus — Node-Tests der reinen Funktionen (lib.js)
    cmds:
      - node tools/test_kochmodus.mjs

  smoke-kochmodus:
    desc: Kochmodus — Playwright-Rauchtest im Container (podman, Image wie auf dem Dev-Server)
    vars:
      PW_VERSION: '{{.PW_VERSION | default "1.59.1"}}'
      PW_IMAGE: '{{.PW_IMAGE | default "container.ams1.ops.xxx/mirrored/playwright:v1.59.1"}}'
    cmds:
      - >-
        podman run --rm --network=host -v .:/work:rw,Z -w /work {{.PW_IMAGE}}
        env PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npx -y -p playwright@{{.PW_VERSION}} sh -c
        'export PLAYWRIGHT_DIR="$(dirname "$(dirname "$(command -v playwright)")")/";
        node tools/smoke_kochmodus.mjs {{.CLI_ARGS}} && node tools/smoke_docsify_link.mjs'
