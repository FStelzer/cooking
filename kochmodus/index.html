<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kochmodus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="title">Kochmodus</h1>
    <div class="row">
      <nav class="row">
        <button data-view="kochen" class="active">Kochen</button>
        <button data-view="einkauf">Einkauf</button>
        <button data-view="lesen">Lesen</button>
      </nav>
      <span class="row">
        <span class="meta">Menge ×</span>
        <button class="btn" data-factor="0.5">½</button>
        <button class="btn" data-factor="1">1</button>
        <button class="btn" data-factor="2">2</button>
        <input class="factor" id="factor" type="number" step="0.25" min="0.25" value="1">
      </span>
    </div>
    <div class="row meta" id="meta"></div>
  </header>
  <main id="main"><p class="fine">Lade Rezept …</p></main>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
