<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kochmodus</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#4F7432">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <a class="tolist" href="?liste=1">‹ Rezepte</a>
      <h1 id="title">Kochmodus</h1>
      <p class="sub" id="meta"></p>
      <div class="bar"><small id="progress"></small><div class="track"><div class="fill" id="fill" style="width:0"></div></div></div>
    </header>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Ansicht">
        <button data-view="plan" aria-pressed="false" id="planBtn" hidden>Plan</button>
        <button data-view="kochen" aria-pressed="true">Kochen</button>
        <button data-view="einkauf" aria-pressed="false">Einkauf</button>
        <button data-view="lesen" aria-pressed="false">Lesen</button>
        <button data-view="notizen" aria-pressed="false">Notizen</button>
      </div>
      <div class="seg" role="group" aria-label="Menge">
        <button data-factor="0.5" aria-pressed="false">½×</button>
        <button data-factor="1" aria-pressed="true">1×</button>
        <button data-factor="2" aria-pressed="false">2×</button>
        <input id="factor" type="number" step="0.25" min="0.25" value="1" aria-label="Faktor">
      </div>
      <button class="btn" id="wake" aria-pressed="false">Bildschirm wach halten</button>
      <button class="btn" id="reset">Neu kochen</button>
      <span class="spacer"></span>
      <span class="status" id="status">Lokal gespeichert</span>
    </div>
    <div class="variants" id="variants" hidden></div>
    <main id="main"><p class="fine">Lade Rezept …</p></main>
  </div>
  <div class="backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
  <div class="dock" id="dock"></div>
  <div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
